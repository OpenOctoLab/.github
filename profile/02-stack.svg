<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img"
 aria-label="The OpenOcto stack">
<defs><style>
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-18}}
  @keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes travel{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(var(--d,64px));opacity:0}}
  .rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
  .fade{animation:fadeIn .7s ease both}
  .dash{stroke-dasharray:5 5;animation:dash 1.1s linear infinite}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .bar{transform-origin:left center;animation:grow .8s cubic-bezier(.22,1,.36,1) both}
  .pk{animation:travel 2.4s cubic-bezier(.5,0,.5,1) infinite}
  .d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
  .d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}
  .d7{animation-delay:.65s}.d8{animation-delay:.75s}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182135"/><stop offset="1" stop-color="#121a29"/></linearGradient>
<linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#0d1117"/><stop offset=".5" stop-color="#16233c"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter></defs>
<text x="36" y="44" font-size="26" font-weight="700" fill="#5eead4" font-family="'Segoe UI',Arial,sans-serif">The stack</text>
<text x="36" y="70" font-size="14" fill="#8fa1c4" font-family="'Segoe UI',Arial,sans-serif">Four layers — from the language you write to the metal that moves.</text>

<g class="rise d1" font-family="'Segoe UI',Arial,sans-serif">
<g transform="translate(30,96)">
<rect x="0" y="0" width="196" height="212" rx="14" fill="url(#cg)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
<rect class="bar" x="0" y="0" width="196" height="4" rx="2" fill="#7dd3fc"/>
<circle class="pulse" cx="30" cy="38" r="18" fill="#1b2c4a" stroke="#7dd3fc" stroke-width="1.5"/>
<text x="30" y="44" text-anchor="middle" font-size="16">🐙</text>
<text x="58" y="43" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="1.4">LANGUAGE</text>
<text x="24" y="82" font-size="16" font-weight="700" fill="#e6edf7">OctoScript</text>
<text x="24" y="110" font-size="12.5" fill="#9fb0d0">Static typing with</text>
<text x="24" y="128" font-size="12.5" fill="#9fb0d0">inference; futures,</text>
<text x="24" y="146" font-size="12.5" fill="#9fb0d0">spawn, await, race.</text>
<text x="24" y="186" font-size="11" fill="#5eead4" font-family="Consolas,monospace">.octo</text>
</g></g>

<g class="rise d2" font-family="'Segoe UI',Arial,sans-serif">
<g transform="translate(242,96)">
<rect x="0" y="0" width="196" height="212" rx="14" fill="url(#cg)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
<rect class="bar" x="0" y="0" width="196" height="4" rx="2" fill="#5eead4"/>
<circle class="pulse" cx="30" cy="38" r="18" fill="#1b2c4a" stroke="#5eead4" stroke-width="1.5"/>
<text x="30" y="44" text-anchor="middle" font-size="16">🌐</text>
<text x="58" y="43" font-size="12" font-weight="700" fill="#5eead4" letter-spacing="1.4">PROTOCOL</text>
<text x="24" y="82" font-size="16" font-weight="700" fill="#e6edf7">OCP</text>
<text x="24" y="110" font-size="12.5" fill="#9fb0d0">Sessions, RPC,</text>
<text x="24" y="128" font-size="12.5" fill="#9fb0d0">pub/sub, tunnels,</text>
<text x="24" y="146" font-size="12.5" fill="#9fb0d0">integrity &amp; crypto.</text>
<text x="24" y="186" font-size="11" fill="#f8b372" font-family="Consolas,monospace">TCP·TLS·QUIC·Air·BLE</text>
</g></g>

<g class="rise d3" font-family="'Segoe UI',Arial,sans-serif">
<g transform="translate(454,96)">
<rect x="0" y="0" width="196" height="212" rx="14" fill="url(#cg)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
<rect class="bar" x="0" y="0" width="196" height="4" rx="2" fill="#f472b6"/>
<circle class="pulse" cx="30" cy="38" r="18" fill="#1b2c4a" stroke="#f472b6" stroke-width="1.5"/>
<text x="30" y="44" text-anchor="middle" font-size="16">⚙️</text>
<text x="58" y="43" font-size="12" font-weight="700" fill="#f472b6" letter-spacing="1.4">TOOLCHAIN</text>
<text x="24" y="82" font-size="16" font-weight="700" fill="#e6edf7">octo · octod</text>
<text x="24" y="110" font-size="12.5" fill="#9fb0d0">Interpreter, device</text>
<text x="24" y="128" font-size="12.5" fill="#9fb0d0">daemon, language</text>
<text x="24" y="146" font-size="12.5" fill="#9fb0d0">server, packages.</text>
<text x="24" y="186" font-size="11" fill="#c4b5fd" font-family="Consolas,monospace">swim·squeeze·sift</text>
</g></g>

<g class="rise d4" font-family="'Segoe UI',Arial,sans-serif">
<g transform="translate(666,96)">
<rect x="0" y="0" width="196" height="212" rx="14" fill="url(#cg)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
<rect class="bar" x="0" y="0" width="196" height="4" rx="2" fill="#facc15"/>
<circle class="pulse" cx="30" cy="38" r="18" fill="#1b2c4a" stroke="#facc15" stroke-width="1.5"/>
<text x="30" y="44" text-anchor="middle" font-size="16">📜</text>
<text x="58" y="43" font-size="12" font-weight="700" fill="#facc15" letter-spacing="1.4">STANDARDS</text>
<text x="24" y="82" font-size="16" font-weight="700" fill="#e6edf7">14 RFCs</text>
<text x="24" y="110" font-size="12.5" fill="#9fb0d0">Observable behaviour</text>
<text x="24" y="128" font-size="12.5" fill="#9fb0d0">fixed in English,</text>
<text x="24" y="146" font-size="12.5" fill="#9fb0d0">open to re-implement.</text>
<text x="24" y="186" font-size="11" fill="#facc15" font-family="Consolas,monospace">RFC 0001–0014</text>
</g></g>

<g class="fade d5" font-family="'Segoe UI',Arial,sans-serif">
<rect x="40" y="352" width="180" height="44" rx="10" fill="#151f33" stroke="#7dd3fc" stroke-width="1.5"/>
<text x="130" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#7dd3fc">OctoScript</text>
<rect x="250" y="352" width="180" height="44" rx="10" fill="#151f33" stroke="#5eead4" stroke-width="1.5"/>
<text x="340" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#5eead4">OCP</text>
<rect x="460" y="352" width="180" height="44" rx="10" fill="#151f33" stroke="#f472b6" stroke-width="1.5"/>
<text x="550" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#f472b6">Daemon</text>
<rect x="670" y="352" width="180" height="44" rx="10" fill="#151f33" stroke="#facc15" stroke-width="1.5"/>
<text x="760" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#facc15">Hardware</text>
<line class="dash" x1="224" y1="374" x2="246" y2="374" stroke="#5eead4" stroke-width="2"/>
<polygon points="246,374 240,369 240,379" fill="#5eead4"/>
<line class="dash" x1="434" y1="374" x2="456" y2="374" stroke="#5eead4" stroke-width="2"/>
<polygon points="456,374 450,369 450,379" fill="#5eead4"/>
<line class="dash" x1="644" y1="374" x2="666" y2="374" stroke="#5eead4" stroke-width="2"/>
<polygon points="666,374 660,369 660,379" fill="#5eead4"/>
<text x="450" y="424" text-anchor="middle" font-size="12.5" fill="#6c7da6">Each layer is specified by public RFCs — swap any implementation freely.</text>
</g></svg>
