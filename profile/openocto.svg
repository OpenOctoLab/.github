<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2060" role="img"
     aria-label="OpenOcto: one open ecosystem that connects code to every machine"
     width="900" height="2060"
     font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#0f1621"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161f30"/>
      <stop offset="1" stop-color="#101724"/>
    </linearGradient>
    <linearGradient id="cardSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c2c"/>
      <stop offset="1" stop-color="#0f1622"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2438"/>
      <stop offset="0.55" stop-color="#152238"/>
      <stop offset="1" stop-color="#1d2b48"/>
    </linearGradient>
    <linearGradient id="endgame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10151f"/>
      <stop offset="0.5" stop-color="#182a4c"/>
      <stop offset="1" stop-color="#10151f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <g id="node">
      <circle r="11" fill="#152034" stroke="#33476e" stroke-width="1"/>
    </g>
    <g id="cardBase">
      <rect x="0" y="0" width="400" height="196" rx="16" fill="url(#card)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
    </g>


</defs>

  <rect x="0" y="0" width="900" height="2060" fill="url(#bg)"/>

  <!-- HEADER / HERO -->
  <rect x="30" y="28" width="840" height="420" rx="20" fill="url(#hero)" stroke="#2f4368" stroke-width="1" filter="url(#sh)"/>
  <circle cx="450" cy="240" r="170" fill="url(#glow)"/>

      <!-- hero: logo core "{ 🐙 }" (as designed) + OpenOcto wordmark + tagline -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="330" y="240" text-anchor="middle" font-size="240" font-weight="700" fill="#5eead4">{</text>
    <text x="570" y="240" text-anchor="middle" font-size="240" font-weight="700" fill="#5eead4">}</text>
    <text x="450" y="240" text-anchor="middle" font-size="168">🐙</text>
    <text x="450" y="360" text-anchor="middle" font-size="68" font-weight="800" letter-spacing="1">
      <tspan fill="#ff7b72">Open</tspan><tspan fill="#d2a8ff">Octo</tspan>
    </text>
    <text x="450" y="400" text-anchor="middle" font-size="27" font-weight="300" letter-spacing="0.5">
      <tspan fill="#79c0ff">one</tspan> <tspan fill="#d2a8ff" font-weight="500">octopus</tspan> <tspan fill="#ff7b72">ignites</tspan> <tspan fill="#79c0ff">an</tspan> <tspan fill="#a5d6ff">entire</tspan> <tspan fill="#ffa657" font-weight="500">ecosystem</tspan>
    </text>
  </g>
<!-- 01 · VISION: card 840x190 so the tentacle nodes fit inside -->
  <g transform="translate(30,494)">
    <rect x="0" y="0" width="840" height="190" rx="16" fill="url(#cardSoft)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
    <text x="36" y="48" font-size="26" font-weight="700" fill="#5eead4">01 · Vision</text>
    <text x="36" y="78" font-size="15" fill="#9fb0d0">A program, a protocol, and a world.</text>
    <text x="36" y="104" font-size="14" fill="#6c7da6">Write one OctoScript program — reach any make, any bus,</text>
    <text x="36" y="124" font-size="14" fill="#6c7da6">any register — every device speaks the same open protocol.</text>

    <!-- tentacle center (520,95); radius 80 so nodes stay inside the 190-tall card -->
    <g transform="translate(720,95)">
      <circle r="26" fill="#182844" stroke="#5eead4" stroke-width="2"/>
      <text y="9" text-anchor="middle" font-size="26">🐙</text>
      <g stroke="#33476e" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.95">
        <line x1="26" y1="0" x2="80" y2="0"/>
        <line x1="18" y1="18" x2="57" y2="57"/>
        <line x1="0" y1="26" x2="0" y2="80"/>
        <line x1="-18" y1="18" x2="-57" y2="57"/>
        <line x1="-26" y1="0" x2="-80" y2="0"/>
        <line x1="-18" y1="-18" x2="-57" y2="-57"/>
        <line x1="0" y1="-26" x2="0" y2="-80"/>
        <line x1="18" y1="-18" x2="57" y2="-57"/>
      </g>
      <g text-anchor="middle" font-size="14">
        <use href="#node" x="80"  y="0"/>   <text x="80"  y="4"   fill="#7dd3fc">🤖</text>
        <use href="#node" x="57"  y="57"/>  <text x="57"  y="61"  fill="#f472b6">⚙️</text>
        <use href="#node" x="0"   y="80"/>  <text x="0"   y="84"  fill="#facc15">📡</text>
        <use href="#node" x="-57" y="57"/>  <text x="-57" y="61"  fill="#34d399">🔌</text>
        <use href="#node" x="-80" y="0"/>   <text x="-80" y="4"   fill="#c4b5fd">💡</text>
        <use href="#node" x="-57" y="-57"/> <text x="-57" y="-53" fill="#f8b372">🛠️</text>
        <use href="#node" x="0"   y="-80"/> <text x="0"   y="-76" fill="#5eead4">🔭</text>
        <use href="#node" x="57"  y="-57"/> <text x="57"  y="-53" fill="#7dd3fc">📷</text>
      </g>
    </g>
  </g>

  <!-- 02 · ECOSYSTEM -->
  <text x="36" y="730" font-size="26" font-weight="700" fill="#5eead4">02 · Ecosystem</text>
  <text x="36" y="756" font-size="14.5" fill="#8fa1c4">Four pieces, one open stack — language to machine.</text>

  <g transform="translate(30,782)">
    <use href="#cardBase"/>
    <circle cx="58" cy="60" r="28" fill="#152034" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="58" y="70" text-anchor="middle" font-size="30">🐙</text>
    <text x="104" y="52" font-size="14" font-weight="700" fill="#e6edf7" letter-spacing="2">LANGUAGE</text>
    <text x="104" y="74" font-size="15" fill="#7dd3fc" font-family="Consolas,'SF Mono',monospace">OctoScript · .octo</text>
    <text x="30" y="116" font-size="13.5" fill="#9fb0d0">A control language built for the physical</text>
    <text x="30" y="136" font-size="13.5" fill="#9fb0d0">world — concurrency native, bus-agnostic.</text>
    <rect x="30" y="152" width="360" height="32" rx="8" fill="#0c1420" stroke="#24344f"/>
    <text x="46" y="173" font-size="13" fill="#5eead4" font-family="Consolas,'SF Mono',monospace">octo swim robot.octo</text>
  </g>

  <g transform="translate(470,782)">
    <use href="#cardBase"/>
    <circle cx="58" cy="60" r="28" fill="#152034" stroke="#5eead4" stroke-width="1.5"/>
    <text x="58" y="70" text-anchor="middle" font-size="30">🌐</text>
    <text x="104" y="52" font-size="14" font-weight="700" fill="#e6edf7" letter-spacing="2">PROTOCOL</text>
    <text x="104" y="74" font-size="15" fill="#5eead4" font-family="Consolas,'SF Mono',monospace">OCP</text>
    <text x="30" y="116" font-size="13.5" fill="#9fb0d0">Sessions, calls, publish/subscribe and</text>
    <text x="30" y="136" font-size="13.5" fill="#9fb0d0">secure tunnels — transport-agnostic.</text>
    <rect x="30" y="152" width="360" height="32" rx="8" fill="#0c1420" stroke="#24344f"/>
    <text x="46" y="173" font-size="13" fill="#f8b372" font-family="Consolas,'SF Mono',monospace">TCP · TLS · QUIC · OCP Air</text>
  </g>

  <g transform="translate(30,1010)">
    <use href="#cardBase"/>
    <circle cx="58" cy="60" r="28" fill="#152034" stroke="#f472b6" stroke-width="1.5"/>
    <text x="58" y="70" text-anchor="middle" font-size="30">⚙️</text>
    <text x="104" y="52" font-size="14" font-weight="700" fill="#e6edf7" letter-spacing="2">ECOSYSTEM</text>
    <text x="104" y="74" font-size="15" fill="#f472b6" font-family="Consolas,'SF Mono',monospace">octo · octod · octolsp</text>
    <text x="30" y="116" font-size="13.5" fill="#9fb0d0">Interpreter, device daemon and language</text>
    <text x="30" y="136" font-size="13.5" fill="#9fb0d0">server — a complete path from code to hardware.</text>
    <rect x="30" y="152" width="360" height="32" rx="8" fill="#0c1420" stroke="#24344f"/>
    <text x="46" y="173" font-size="13" fill="#c4b5fd" font-family="Consolas,'SF Mono',monospace">run · format · lint · drive · install</text>
  </g>

  <g transform="translate(470,1010)">
    <use href="#cardBase"/>
    <circle cx="58" cy="60" r="28" fill="#152034" stroke="#facc15" stroke-width="1.5"/>
    <text x="58" y="70" text-anchor="middle" font-size="30">📜</text>
    <text x="104" y="52" font-size="14" font-weight="700" fill="#e6edf7" letter-spacing="2">STANDARDS</text>
    <text x="104" y="74" font-size="15" fill="#facc15" font-family="Consolas,'SF Mono',monospace">RFC 0001 – 0013</text>
    <text x="30" y="116" font-size="13.5" fill="#9fb0d0">Thirteen open RFCs fix the observable</text>
    <text x="30" y="136" font-size="13.5" fill="#9fb0d0">behavior; implementations stay free to differ.</text>
    <rect x="30" y="152" width="360" height="32" rx="8" fill="#0c1420" stroke="#24344f"/>
    <text x="46" y="173" font-size="13" fill="#facc15" font-family="Consolas,'SF Mono',monospace">open · reviewable · re-implementable</text>
  </g>

  <!-- 03 · DATA FLOW -->
  <text x="36" y="1270" font-size="26" font-weight="700" fill="#5eead4">03 · Data Flow</text>
  <text x="36" y="1296" font-size="14.5" fill="#8fa1c4">Your world, one open protocol, and the real world.</text>

  <g transform="translate(30,1322)">
    <rect x="0" y="0" width="840" height="240" rx="16" fill="url(#cardSoft)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>

    <!-- left panel: 30 wide..330 wide, 256 wide total -->
    <rect x="30" y="36" width="256" height="160" rx="12" fill="#131d30" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="158" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#7dd3fc">Your world</text>
    <text x="48" y="98"  font-size="13.5" font-family="Consolas,monospace" fill="#5eead4">program.octo</text>
    <text x="48" y="122" font-size="13.5" font-family="Consolas,monospace" fill="#7dd3fc">└─ octo</text>
    <text x="48" y="146" font-size="13.5" font-family="Consolas,monospace" fill="#c4b5fd">└─ octolsp</text>
    <text x="48" y="170" font-size="13.5" font-family="Consolas,monospace" fill="#f472b6">└─ tentacle</text>

    <!-- arrow -->
    <line x1="286" y1="116" x2="350" y2="116" stroke="#5eead4" stroke-width="2.5"/>
    <polygon points="350,116 342,111 342,121" fill="#5eead4"/>

    <!-- center OCP box: 354..506 -->
    <rect x="354" y="66" width="152" height="100" rx="12" fill="#182844" stroke="#5eead4" stroke-width="2"/>
    <text x="430" y="110" text-anchor="middle" font-size="36">🐙</text>
    <text x="430" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#5eead4" letter-spacing="2">OCP</text>

    <!-- arrow -->
    <line x1="506" y1="116" x2="570" y2="116" stroke="#5eead4" stroke-width="2.5"/>
    <polygon points="570,116 562,111 562,121" fill="#5eead4"/>

    <!-- right panel: 574..870 wide -->
    <rect x="574" y="36" width="256" height="160" rx="12" fill="#131d30" stroke="#f472b6" stroke-width="1.5"/>
    <text x="702" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#f472b6">The real world</text>
    <text x="592" y="98"  font-size="13.5" fill="#9fb0d0">🤖 robots · ⚙️ production lines</text>
    <text x="592" y="122" font-size="13.5" fill="#9fb0d0">📡 sensor nets · 🔌 8 KB MCUs</text>
    <text x="592" y="146" font-size="13.5" fill="#9fb0d0">💡 any device that can be described</text>

    <!-- caption (2 lines, centered) -->
    <text x="450" y="212" text-anchor="middle" font-size="13" fill="#6c7da6">A device declares its capabilities in a descriptor; the daemon</text>
    <text x="450" y="228" text-anchor="middle" font-size="13" fill="#6c7da6">lets it speak OCP — your program sees capabilities, not hardware.</text>
  </g>

  <!-- 04 · ENDGAME -->
  <g transform="translate(30,1606)">
    <rect x="0" y="0" width="840" height="124" rx="16" fill="url(#endgame)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
    <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#5eead4" letter-spacing="1">04 · The Endgame</text>

    <g text-anchor="middle">
      <g>
        <circle cx="190" cy="68" r="24" fill="#131d30" stroke="#7dd3fc" stroke-width="1.5"/>
        <text x="190" y="74" font-size="20">🏭</text>
        <text x="190" y="112" font-size="13" fill="#7dd3fc" font-weight="600">A factory is a program</text>
      </g>
      <g>
        <circle cx="450" cy="68" r="24" fill="#131d30" stroke="#5eead4" stroke-width="1.5"/>
        <text x="450" y="74" font-size="20">🧩</text>
        <text x="450" y="112" font-size="13" fill="#5eead4" font-weight="600">Anything describable</text>
      </g>
      <g>
        <circle cx="710" cy="68" r="24" fill="#131d30" stroke="#f472b6" stroke-width="1.5"/>
        <text x="710" y="74" font-size="20">🤝</text>
        <text x="710" y="112" font-size="13" fill="#f472b6" font-weight="600">Built by everyone</text>
      </g>
    </g>

    <line x1="216" y1="68" x2="424" y2="68" stroke="#33476e" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="476" y1="68" x2="684" y2="68" stroke="#33476e" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 05 · WHY NOT ROS? -->
  <text x="36" y="1766" font-size="26" font-weight="700" fill="#5eead4">05 · Why Not ROS?</text>
  <text x="36" y="1792" font-size="14.5" fill="#8fa1c4">Built for embedded + open ecosystem, not desktop tooling.</text>

  <g transform="translate(30,1818)">
    <rect x="0" y="0" width="840" height="132" rx="16" fill="url(#cardSoft)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>

    <g text-anchor="middle">
      <g>
        <circle cx="140" cy="34" r="18" fill="#131d30" stroke="#5eead4" stroke-width="1.5"/>
        <text x="140" y="40" font-size="17">🏗️</text>
        <text x="140" y="74" font-size="13" font-weight="700" fill="#5eead4">Runs anywhere</text>
        <text x="140" y="94" font-size="11.5" fill="#9fb0d0">OCP Air targets 8 KB</text>
        <text x="140" y="110" font-size="11.5" fill="#9fb0d0">MCUs, no OS required</text>
      </g>
      <g>
        <circle cx="420" cy="34" r="18" fill="#131d30" stroke="#7dd3fc" stroke-width="1.5"/>
        <text x="420" y="40" font-size="17">🛠️</text>
        <text x="420" y="74" font-size="13" font-weight="700" fill="#7dd3fc">One open language</text>
        <text x="420" y="94" font-size="11.5" fill="#9fb0d0">device-agnostic control;</text>
        <text x="420" y="110" font-size="11.5" fill="#9fb0d0">no per-hardware SDK</text>
      </g>
      <g>
        <circle cx="700" cy="34" r="18" fill="#131d30" stroke="#f472b6" stroke-width="1.5"/>
        <text x="700" y="40" font-size="17">📜</text>
        <text x="700" y="74" font-size="13" font-weight="700" fill="#f472b6">Standards first</text>
        <text x="700" y="94" font-size="11.5" fill="#9fb0d0">13 public RFCs define</text>
        <text x="700" y="110" font-size="11.5" fill="#9fb0d0">behavior; implementations free</text>
      </g>
    </g>
  </g>
  <!-- 06 · CALL TO ACTION -->
  <text x="450" y="1982" text-anchor="middle" font-size="14" fill="#8fa1c4">
    Repositories · RFCs · releases under <tspan fill="#5eead4" font-weight="700">OpenOctoLab</tspan> · Apache-2.0 / MIT
  </text>
  <text x="450" y="2006" text-anchor="middle" font-size="13.5" fill="#5eead4" font-weight="600">Join in — help the tentacles reach further 🐙</text>
</svg>
