<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img"
 aria-label="How data flows through OpenOcto">
<defs><style>
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-18}}
  @keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes travel{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(var(--d,64px));opacity:0}}
  .rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
  .fade{animation:fadeIn .7s ease both}
  .dash{stroke-dasharray:5 5;animation:dash 1.1s linear infinite}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .bar{transform-origin:left center;animation:grow .8s cubic-bezier(.22,1,.36,1) both}
  .pk{animation:travel 2.4s cubic-bezier(.5,0,.5,1) infinite}
  .d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
  .d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}
  .d7{animation-delay:.65s}.d8{animation-delay:.75s}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182135"/><stop offset="1" stop-color="#121a29"/></linearGradient>
<linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#0d1117"/><stop offset=".5" stop-color="#16233c"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter></defs>
<text x="36" y="44" font-size="26" font-weight="700" fill="#5eead4" font-family="'Segoe UI',Arial,sans-serif">How it flows</text>
<text x="36" y="70" font-size="14" fill="#8fa1c4" font-family="'Segoe UI',Arial,sans-serif">Your program speaks capabilities; the daemon speaks hardware.</text>

<g class="rise d2"><g transform="translate(30,90)" font-family="'Segoe UI',Arial,sans-serif">
<rect x="0" y="0" width="840" height="196" rx="16" fill="url(#cg)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
<rect x="30" y="40" width="224" height="116" rx="12" fill="#151f33" stroke="#7dd3fc" stroke-width="1.5"/>
<text x="142" y="70" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7dd3fc">Your world</text>
<text x="50" y="98" font-size="12.5" fill="#5eead4" font-family="Consolas,monospace">program.octo</text>
<text x="50" y="120" font-size="12.5" fill="#7dd3fc" font-family="Consolas,monospace">└─ octo</text>
<text x="50" y="142" font-size="12.5" fill="#c4b5fd" font-family="Consolas,monospace">└─ octolsp</text>
<line x1="254" y1="98" x2="330" y2="98" stroke="#5eead4" stroke-width="2.5"/>
<polygon points="330,98 322,93 322,103" fill="#5eead4"/>
<g class="pk"><circle cx="256" cy="98" r="3.5" fill="#5eead4" style="--d:70px"/></g>
<g class="pk" style="animation-delay:1.2s"><circle cx="256" cy="98" r="3.5" fill="#7dd3fc" style="--d:70px"/></g>
<rect class="pulse" x="336" y="52" width="128" height="92" rx="12" fill="#1b2c4a" stroke="#5eead4" stroke-width="2"/>
<text x="400" y="94" text-anchor="middle" font-size="30">🐙</text>
<text x="400" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5eead4" letter-spacing="2">OCP</text>
<line x1="464" y1="98" x2="540" y2="98" stroke="#5eead4" stroke-width="2.5"/>
<polygon points="540,98 532,93 532,103" fill="#5eead4"/>
<g class="pk" style="animation-delay:.6s"><circle cx="466" cy="98" r="3.5" fill="#f472b6" style="--d:70px"/></g>
<rect x="546" y="40" width="224" height="116" rx="12" fill="#151f33" stroke="#f472b6" stroke-width="1.5"/>
<text x="658" y="70" text-anchor="middle" font-size="14.5" font-weight="700" fill="#f472b6">The real world</text>
<text x="566" y="98" font-size="12.5" fill="#9fb0d0">🤖 robots · ⚙️ lines</text>
<text x="566" y="120" font-size="12.5" fill="#9fb0d0">📡 sensor nets</text>
<text x="566" y="142" font-size="12.5" fill="#9fb0d0">🔌 8 KB microcontrollers</text>
<text x="435" y="176" text-anchor="middle" font-size="12.5" fill="#6c7da6">A descriptor declares what a device can do; octod makes it speak OCP.</text>
</g></g>

<g class="fade d5" font-family="'Segoe UI',Arial,sans-serif">
<rect x="30" y="316" width="840" height="96" rx="16" fill="url(#pg)" stroke="#2a3a59" stroke-width="1"/>
<text x="450" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#5eead4">One descriptor per device — no driver code</text>
<g class="pulse"><text x="150" y="382" text-anchor="middle" font-size="24">🤖</text>
<text x="150" y="398" text-anchor="middle" font-size="11" fill="#8fa1c4">robot.octo</text></g>
<g class="pulse" style="animation-delay:.3s"><text x="330" y="382" text-anchor="middle" font-size="24">🔌</text>
<text x="330" y="398" text-anchor="middle" font-size="11" fill="#8fa1c4">mcu.octo</text></g>
<g class="pulse" style="animation-delay:.6s"><text x="510" y="382" text-anchor="middle" font-size="24">📡</text>
<text x="510" y="398" text-anchor="middle" font-size="11" fill="#8fa1c4">sensor.octo</text></g>
<g class="pulse" style="animation-delay:.9s"><text x="690" y="382" text-anchor="middle" font-size="24">📷</text>
<text x="690" y="398" text-anchor="middle" font-size="11" fill="#8fa1c4">camera.octo</text></g>
</g></svg>