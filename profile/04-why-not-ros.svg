<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img"
 aria-label="Why OpenOcto instead of ROS">
<defs><style>
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-18}}
  @keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes travel{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(var(--d,64px));opacity:0}}
  .rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
  .fade{animation:fadeIn .7s ease both}
  .dash{stroke-dasharray:5 5;animation:dash 1.1s linear infinite}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .bar{transform-origin:left center;animation:grow .8s cubic-bezier(.22,1,.36,1) both}
  .pk{animation:travel 2.4s cubic-bezier(.5,0,.5,1) infinite}
  .d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
  .d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}
  .d7{animation-delay:.65s}.d8{animation-delay:.75s}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182135"/><stop offset="1" stop-color="#121a29"/></linearGradient>
<linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#0d1117"/><stop offset=".5" stop-color="#16233c"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter></defs>
<text x="36" y="44" font-size="26" font-weight="700" fill="#5eead4" font-family="'Segoe UI',Arial,sans-serif">Why not ROS?</text>
<text x="36" y="70" font-size="14" fill="#8fa1c4" font-family="'Segoe UI',Arial,sans-serif">Built for embedded hardware and an open ecosystem — not desktop tooling.</text>

<g class="rise d1" font-family="'Segoe UI',Arial,sans-serif"><g transform="translate(30,96)">
<rect x="0" y="0" width="270" height="150" rx="14" fill="url(#cg)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
<rect class="bar" x="0" y="0" width="270" height="4" rx="2" fill="#5eead4"/>
<circle class="pulse" cx="42" cy="46" r="19" fill="#1b2c4a" stroke="#5eead4" stroke-width="1.5"/>
<text x="42" y="52" text-anchor="middle" font-size="17">💾</text>
<text x="76" y="52" font-size="14" font-weight="700" fill="#5eead4">Runs anywhere</text>
<text x="28" y="92" font-size="12.5" fill="#9fb0d0">OCP Air fits 8 KB MCUs</text>
<text x="28" y="112" font-size="12.5" fill="#9fb0d0">with no OS at all —</text>
<text x="28" y="132" font-size="12.5" fill="#9fb0d0">ROS needs a Linux host.</text></g></g>

<g class="rise d3" font-family="'Segoe UI',Arial,sans-serif"><g transform="translate(315,96)">
<rect x="0" y="0" width="270" height="150" rx="14" fill="url(#cg)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
<rect class="bar" x="0" y="0" width="270" height="4" rx="2" fill="#7dd3fc"/>
<circle class="pulse" cx="42" cy="46" r="19" fill="#1b2c4a" stroke="#7dd3fc" stroke-width="1.5"/>
<text x="42" y="52" text-anchor="middle" font-size="17">🧩</text>
<text x="76" y="52" font-size="14" font-weight="700" fill="#7dd3fc">One language</text>
<text x="28" y="92" font-size="12.5" fill="#9fb0d0">Device-agnostic control;</text>
<text x="28" y="112" font-size="12.5" fill="#9fb0d0">no per-hardware SDK,</text>
<text x="28" y="132" font-size="12.5" fill="#9fb0d0">no driver per board.</text></g></g>

<g class="rise d5" font-family="'Segoe UI',Arial,sans-serif"><g transform="translate(600,96)">
<rect x="0" y="0" width="270" height="150" rx="14" fill="url(#cg)" stroke="#2a3a59" stroke-width="1" filter="url(#sh)"/>
<rect class="bar" x="0" y="0" width="270" height="4" rx="2" fill="#f472b6"/>
<circle class="pulse" cx="42" cy="46" r="19" fill="#1b2c4a" stroke="#f472b6" stroke-width="1.5"/>
<text x="42" y="52" text-anchor="middle" font-size="17">📜</text>
<text x="76" y="52" font-size="14" font-weight="700" fill="#f472b6">Standards first</text>
<text x="28" y="92" font-size="12.5" fill="#9fb0d0">14 public RFCs fix</text>
<text x="28" y="112" font-size="12.5" fill="#9fb0d0">observable behaviour;</text>
<text x="28" y="132" font-size="12.5" fill="#9fb0d0">implementations stay free.</text></g></g>

<g class="fade d6" font-family="'Segoe UI',Arial,sans-serif">
<rect x="40" y="286" width="360" height="120" rx="14" fill="#1a1420" stroke="#6b3a44" stroke-width="1"/>
<text x="220" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#ff7b72">ROS</text>
<text x="62" y="342" font-size="12.5" fill="#a98b95">• Linux host, GB-scale runtime</text>
<text x="62" y="362" font-size="12.5" fill="#a98b95">• C++ / Python nodes</text>
<text x="62" y="382" font-size="12.5" fill="#a98b95">• A driver for every device</text>
<rect x="500" y="286" width="360" height="120" rx="14" fill="#101c26" stroke="#2f6b70" stroke-width="1"/>
<text x="680" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#5eead4">OpenOcto</text>
<text x="522" y="342" font-size="12.5" fill="#9fb0d0">• 8 KB MCUs, no OS required</text>
<text x="522" y="362" font-size="12.5" fill="#9fb0d0">• One OctoScript program</text>
<text x="522" y="382" font-size="12.5" fill="#9fb0d0">• One descriptor per device</text>
<text x="450" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#8fa1c4">VS</text>
</g></svg>
